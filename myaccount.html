<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta & Tracking de Pedidos | Rodamientos RM</title>
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F4F6FA; color: #1F2937; margin: 0; }
        .soft-card { background-color: #FFFFFF; border-radius: 20px; border: 1px solid #E5E7EB; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); }
        .gradient-header { background: linear-gradient(135deg, #0C3B7C 0%, #00A8E8 100%); }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="gradient-header text-white shadow-md">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="https://i.postimg.cc/gJFWTtwg/photo-2026-09-18-11-07-31.jpg" class="w-10 h-10 rounded-full border-2 border-white object-cover shadow" alt="Logo">
                <h1 class="font-extrabold text-base">Mis Pedidos - Rodamientos RM</h1>
            </div>
            <a href="index.html" class="text-xs font-bold underline text-sky-100">← Ir a la Tienda</a>
        </div>
    </header>

    <main class="flex-1 max-w-5xl mx-auto px-6 py-10 w-full space-y-8">
        
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Estado de tus Pedidos</h1>
                <p class="text-xs text-slate-400" id="user-email-display">Cargando datos del cliente...</p>
            </div>
            <button onclick="handleLogout()" class="px-4 py-2 bg-rose-50 text-rose-600 font-bold rounded-xl text-xs hover:bg-rose-100 transition">Cerrar Sesión</button>
        </div>

        <div id="orders-list" class="space-y-6">
            <div class="soft-card p-8 text-center text-slate-400 text-sm">Cargando historial de pedidos...</div>
        </div>

    </main>

    <footer class="bg-slate-900 text-white text-center py-6 text-xs mt-auto">
        <p>© 2026 Rodamientos RM. Todos los derechos reservados.</p>
    </footer>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD3vPGQuQosfgpDqPQOipFS0ArTcz_Jl94",
            authDomain: "rodamientosrm.firebaseapp.com",
            projectId: "rodamientosrm",
            storageBucket: "rodamientosrm.firebasestorage.app",
            messagingSenderId: "958419429584",
            appId: "1:958419429584:web:05183fdd8d9301560096d5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.handleLogout = function() {
            signOut(auth).then(() => window.location.href = 'index.html');
        };

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'cart.html';
            } else {
                document.getElementById('user-email-display').innerText = "Cliente: " + user.email;
                loadMyOrders(user.uid);
            }
        });

        function loadMyOrders(uid) {
            const container = document.getElementById('orders-list');
            const q = query(collection(db, "orders"), where("uid", "==", uid));

            onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    container.innerHTML = '<div class="soft-card p-8 text-center text-slate-400 text-sm">No has realizado ningún pedido aún.</div>';
                    return;
                }

                let html = '';
                snapshot.forEach(docSnap => {
                    const order = docSnap.data();
                    const statusColors = {
                        "En Proceso": "bg-amber-100 text-amber-700 border-amber-200",
                        "Enviado": "bg-sky-100 text-sky-700 border-sky-200",
                        "Entregado": "bg-emerald-100 text-emerald-700 border-emerald-200",
                        "Listo para Recogida en Tienda": "bg-purple-100 text-purple-700 border-purple-200"
                    };

                    html += `
                        <div class="soft-card p-6 space-y-4">
                            <div class="flex flex-col md:flex-row md:items-center justify-between gap-2 border-b pb-4">
                                <div>
                                    <span class="text-[10px] font-bold text-slate-400">N° TRACKING:</span>
                                    <h3 class="text-base font-extrabold text-blue-900">${order.tracking}</h3>
                                </div>
                                <div>
                                    <span class="px-3 py-1 rounded-full text-xs font-bold border ${statusColors[order.estatus] || 'bg-slate-100 text-slate-700'}">
                                        📌 ${order.estatus}
                                    </span>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                                <div>
                                    <p class="font-bold text-slate-700">Detalles de Entrega:</p>
                                    <p class="text-slate-500">${order.tipo_entrega}</p>
                                    <p class="text-slate-500">📍 ${order.direccion}</p>
                                </div>
                                <div>
                                    <p class="font-bold text-slate-700">Monto Total:</p>
                                    <p class="text-sky-600 font-extrabold text-sm">$${order.total_ref.toFixed(2)} REF</p>
                                    <p class="text-slate-500 font-semibold">${order.total_bs.toLocaleString('es-VE')} Bs</p>
                                </div>
                            </div>

                            <div class="border-t pt-3">
                                <p class="text-xs font-bold text-slate-700 mb-2">Productos:</p>
                                <div class="flex flex-wrap gap-2">
                                    ${order.productos.map(p => `
                                        <span class="px-2.5 py-1 bg-slate-100 rounded-lg text-[11px] font-semibold text-slate-600">
                                            ${p.titulo} (x${p.qty})
                                        </span>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            });
        }

        lucide.createIcons();
    </script>
</body>
</html>
